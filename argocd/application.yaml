# ============================================================
# ArgoCD Application - GitOps 持续交付
# 指向 GitHub 上的 go-cicd-deploy 仓库
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-cicd-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/HT-MA/go-cicd-deploy.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: go-cicd-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
