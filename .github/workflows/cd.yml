# ============================================================
# CD Pipeline - 推送镜像后自动更新 K8s 部署清单
# 职责：打 tag → 构建镜像推送 Docker Hub → 更新 go-cicd-deploy 仓库
# ============================================================
name: CD

on:
  push:
    tags:
      - 'v*'

env:
  DOCKERHUB_REPO: wojiaomht/go-cicd-demo

jobs:
  # ============ Job 1: 构建并推送 release 镜像到 Docker Hub ============
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_REPO }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ============ Job 2: 更新 go-cicd-deploy 仓库的 K8s 清单 ============
  update-manifests:
    name: 📦 Update Deploy Repo
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: HT-MA/go-cicd-deploy
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy

      - name: Update image tag in kustomization.yaml
        run: |
          cd deploy
          # 更新 kustomization.yaml 中的镜像 tag
          sed -i "s/newTag: .*/newTag: ${{ needs.release.outputs.version }}/" kustomization.yaml
          echo "📦 Updated image tag to: ${{ needs.release.outputs.version }}"
          cat kustomization.yaml

      - name: Commit and push
        run: |
          cd deploy
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: deploy ${{ needs.release.outputs.version }}"
          git push
