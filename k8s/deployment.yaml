apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-cicd-demo
  labels:
    app: go-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-cicd-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: go-cicd-demo
    spec:
      containers:
        - name: go-cicd-demo
          image: wojiaomht/go-cicd-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
